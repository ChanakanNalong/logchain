# ---- หลักการเดิมของ postgres:16-alpine ----
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# ---- application connections (ผ่าน Docker network) ----
# ทุก role เก็บ password เป็น SCRAM (password_encryption = scram-sha-256)
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256

# ---- replication user (สำหรับ streaming replication) ----
# คอลัมน์ที่ 2 = database (`replication` เป็น keyword พิเศษ), คอลัมน์ที่ 3 = user
# user ต้องเป็น `replicator` ให้ตรงกับ role จริง
host    replication     replicator      172.16.0.0/12           scram-sha-256
host    replication     replicator      10.0.0.0/8              scram-sha-256