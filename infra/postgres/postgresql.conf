# ---- Basic ----
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB

# ---- Write-Ahead Log (WAL) -required for replication ----
wal_level = replica
max_wal_senders = 3
max_replication_slots = 3
hot_standby = on
wal_keep_size = 1024

# ---- Logging ----
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '

# ---- Replication settings ----
synchronous_commit = on
# ไม่ใช้ synchronous_standby_names - asynchronous replication
# (ถ้าอยาก strict synct sync ค่อยเปิดทีหลัง - ทำให้ primary ช้าลงถ้า standby ตาย)