# alert rule ของ LogChain — โหลดผ่าน rule_files ใน prometheus.yml
# ยังไม่มี Alertmanager: alert ขึ้นที่ http://localhost:9090/alerts และ metric ALERTS (Grafana อ่านได้)
# ทดสอบ: docker run --rm -v $PWD/infra/prometheus:/p -w /p --entrypoint promtool \
#          prom/prometheus:v2.55.0 test rules alerts.test.yml
groups:
  - name: logchain-backend
    rules:
      # guard ใน src/common/process/unhandled-rejection.ts กัน process ตายไว้แล้ว แต่แต่ละครั้งคือ
      # promise ของ ethers ที่หลุดนอกสาย await = บั๊กที่ต้องตามหา (เคยฆ่าทั้ง process มาแล้ว 2 ครั้ง)
      # เกิดครั้งเดียวก็ต้องรู้ จึงไม่มี `for:` — ค้างอยู่ 1 ชม. หลังครั้งล่าสุดแล้วหายเอง
      # max by (code): เผื่อ backend ถูก scrape มากกว่า 1 target (เคยเป็นแบบนั้น — ดู prometheus.yml
      # และตอนรันบน host) — ไม่รวมจะเด้ง alert ซ้ำต่อเหตุการณ์เดียว
      - alert: UnhandledEthersRejection
        expr: max by (code) (increase(logchain_unhandled_ethers_rejections_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'ethers rejection หลุดนอก await ({{ $labels.code }}) บน backend'
          description: >-
            {{ $value | printf "%.0f" }} ครั้งใน 1 ชม. ที่ผ่านมา — process ยังไม่ตาย (guard รับไว้)
            แต่เป็นบั๊ก: ดู log ERROR "Unhandled ethers rejection" ของ backend แล้วหาว่า promise ไหน
            ไม่มีใคร await (ประวัติ: network detection ก่อนใส่ staticNetwork · NonceManager)

  - name: logchain-pipeline
    rules:
      # detection เจอการโจมตีแล้ว แต่ส่ง alert ขึ้น Kafka ไม่สำเร็จ = alert นั้นไม่เข้า DB ไม่ขึ้น dashboard
      # (เคยเกิดจริงหลัง down -v — alerts.raw หายไปเงียบ ๆ) · ครั้งเดียวก็ต้องรู้
      - alert: DetectionAlertPublishFailed
        expr: sum by (topic) (increase(consumer_alert_publish_failures_total[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 'detection ส่ง alert ขึ้น {{ $labels.topic }} ไม่สำเร็จ'
          description: >-
            {{ $value | printf "%.0f" }} alert ใน 15 นาทีที่ตรวจเจอแล้วแต่ไม่ถึง backend (ไม่เข้า DB / dashboard)
            ดู `docker logs logchain-detection-consumer 2>&1 | grep "PUBLISH FAILED"` · เช็ค topic และ broker

      # consumer ค้าง: มี message รอ แต่ offset ไม่ขยับเลย 10 นาที (lag > 0 ชั่วคราวตอนมี traffic เป็นเรื่องปกติ)
      # detection-service = ตรวจจับหยุด · nestjs-alerts-persister = alert ไม่ถูกบันทึกลง DB
      - alert: KafkaConsumerStuck
        expr: >-
          kafka_consumergroup_lag_sum > 0
          and on (consumergroup, topic)
          delta(kafka_consumergroup_current_offset_sum[10m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'consumer {{ $labels.consumergroup }} ค้างบน {{ $labels.topic }} (lag {{ $value }})'
          description: >-
            มี message รอ {{ $value }} ใบ แต่ offset ไม่ขยับมา 10 นาทีขึ้นไป
            `docker exec logchain-kafka-1 /opt/bitnami/kafka/bin/kafka-consumer-groups.sh
            --bootstrap-server localhost:9092 --describe --group {{ $labels.consumergroup }}`

  - name: logchain-infra
    rules:
      # target ที่ Prometheus scrape ไม่ได้ = service ล่ม (หรือ exporter ล่ม) · prometheus.yml มี target ละตัวเดียว
      # ต่อแอปแล้ว (worklog 2026-09-23 หัวข้อ 20) ถ้ากลับไปใส่ host.docker.internal คู่กัน rule นี้จะเด้งตลอด
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} ({{ $labels.instance }}) ไม่ตอบ'
          description: >-
            Prometheus scrape {{ $labels.instance }} ไม่ได้มา 2 นาที ·
            `docker compose ps` แล้วดู log ของ service นั้น

      # exporter ยังตอบแต่ต่อ Postgres ไม่ได้ — ServiceDown จับไม่ได้เพราะ up ของ exporter ยังเป็น 1
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Postgres ไม่ตอบ (postgres-exporter ต่อไม่ได้)'
          description: >-
            ingest ใหม่พัง (log เข้า DB ไม่ได้) · `docker logs logchain-postgres --tail 50`

      # cluster มี 3 broker (replication 3) — ขาดตัวเดียวยังทำงานได้แต่ความทนทานลดลง
      - alert: KafkaBrokerMissing
        expr: kafka_brokers < 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Kafka เหลือ {{ $value }} จาก 3 broker'
          description: >-
            `docker compose ps kafka-1 kafka-2 kafka-3` · ถ้าเหลือไม่ถึง min.insync.replicas ส่ง log ไม่ได้
            (backend เก็บลง kafka_pending_logs รอ replay ให้เอง)

  - name: logchain-integrity
    rules:
      # tx ส่งแล้วแต่ไม่เคยลง chain (drop / chain reset) → verify ได้ MISSING → ค้าง UNVERIFIED
      # INTEGRITY_AUTO_REANCHOR=false (ค่าเริ่มต้น ตั้งใจ) = ไม่มีใครส่งใหม่ ต้องมีคนตัดสินใจ
      # ปกติ UNVERIFIED หายเองในไม่กี่นาที (tx timeout 2 นาที + verify ทุก 1 นาที) — 30 นาทีคือผิดปกติแน่
      - alert: BatchStuckUnverified
        expr: logchain_batch_oldest_age_seconds{status="UNVERIFIED"} > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'batch ค้าง UNVERIFIED มา {{ $value | humanizeDuration }}'
          description: >-
            root ของ batch ไม่อยู่บน chain และระบบไม่ส่งใหม่เอง (INTEGRITY_AUTO_REANCHOR=false) ·
            ตรวจว่าไม่มีใครแก้ DB แล้วเปิด re-anchor ชั่วคราว — README Troubleshooting
            "batch ค้าง UNVERIFIED เป็นชั่วโมง"

      # PENDING = ระหว่าง seal (สร้าง batch → anchor → เขียน mapping) ปกติจบในไม่ถึง 2 นาที
      # ค้างนาน = seal พังกลางทาง (เช่น process ตายระหว่างรอ tx) — batch ใบนี้ไม่มีใครเก็บต่อ
      - alert: BatchStuckPending
        expr: logchain_batch_oldest_age_seconds{status="PENDING"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'batch ค้าง PENDING มา {{ $value | humanizeDuration }}'
          description: >-
            seal ไม่จบ · `docker logs logchain-backend 2>&1 | grep -i -E "batch|seal"` ·
            `select id, status, sealed_at, tx_hash from batches where status='PENDING'`

  - name: logchain-backup
    rules:
      # backup รอบละ 24 ชม. — เผื่อ 2 ชม. ให้รอบที่ช้า/ลองใหม่ · เกินนี้ = RPO 24 ชม. ในเอกสาร DR ไม่เป็นจริงแล้ว
      - alert: PostgresBackupStale
        expr: time() - logchain_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'backup Postgres ล่าสุดเก่า {{ $value | humanizeDuration }}'
          description: >-
            RPO 24 ชม. ไม่เป็นจริงแล้ว · `docker logs logchain-postgres-backup --tail 20` ·
            สั่งรอบพิเศษ `docker exec logchain-postgres-backup sh /backup.sh once`

      # ลองใหม่ทุก 5 นาทีเอง — พังติดกันครึ่งชั่วโมงคือไม่ใช่ชั่วคราวแล้ว (รหัส / DB / ดิสก์เต็ม)
      # เตือนก่อน Stale ~1 วัน
      - alert: PostgresBackupFailing
        expr: logchain_backup_last_run_success == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'backup Postgres พังติดกัน 30 นาทีขึ้นไป'
          description: >-
            `docker logs logchain-postgres-backup --tail 20` · เช็คพื้นที่ดิสก์ของ ./backups และ POSTGRES_PASSWORD ใน .env

      # ไม่มี metric เลย = service postgres-backup ไม่ได้รัน หรือ node-exporter อ่าน ./backups/metrics ไม่ได้
      # (Stale/Failing เงียบในกรณีนี้ เพราะไม่มี series ให้เทียบ)
      - alert: PostgresBackupMissing
        expr: absent(logchain_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'ไม่มีสถานะ backup Postgres'
          description: >-
            `docker compose ps postgres-backup node-exporter` · ไฟล์ ./backups/metrics/backup.prom ต้องมีอยู่
