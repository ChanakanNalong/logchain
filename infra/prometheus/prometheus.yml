# prometheus scrape config สำหรับ LogChain
global:
  scrape_interval:      15s
  evaluation_interval:  15s

# alert rule (+ unit test ใน alerts.test.yml) — ยังไม่มี Alertmanager ดูที่ /alerts
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus เอง
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics (CPU/RAM/disk ของเครื่อง)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # แอปทั้ง 3 ตัวรันได้ 2 โหมด: ในคอมโพส (ชื่อ service) หรือบน host
  # (host.docker.internal) — ใส่ทั้งคู่ไว้เลย โหมดที่ไม่ได้ใช้จะขึ้น DOWN ใน
  # /targets ซึ่งถูกต้องตามความเป็นจริง ดีกว่าต้องแก้ไฟล์นี้ทุกครั้งที่สลับโหมด

  # NestJS api-gateway
  - job_name: 'nestjs-api'
    static_configs:
      - targets: ['backend:3000', 'host.docker.internal:3000']
    metrics_path: '/metrics'

  # FastAPI detection service
  - job_name: 'fastapi-detect'
    static_configs:
      - targets: ['detection-api:8000', 'host.docker.internal:8000']
    metrics_path: '/metrics'

  # Python Kafka consumer - prometheus_client start_http_server(9101)
  - job_name: 'detection-consumer'
    static_configs:
      - targets: ['detection-consumer:9101', 'host.docker.internal:9101']
    metrics_path: '/metrics'

  # Kafka cluster metrics (ISR, replication lag, consumer offsets)
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']