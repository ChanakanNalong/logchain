# prometheus scrape config สำหรับ LogChain
global:
  scrape_interval:      15s
  evaluation_interval:  15s

# alert rule (+ unit test ใน alerts.test.yml) → ส่งต่อให้ Alertmanager (email ถ้าตั้งไว้)
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus เอง
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics (CPU/RAM/disk ของเครื่อง)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # แอปทั้ง 3 ตัว scrape ผ่านชื่อ service ใน compose เท่านั้น
  # เดิมใส่ host.docker.internal:<port> คู่ไว้ด้วย (เผื่อรันแอปบน host) แต่ compose publish port
  # 3000/8000 ออก host → target ฝั่ง host วนกลับมาเจอ container ตัวเดียวกัน = scrape ซ้ำ 2 ครั้ง
  # (Grafana เส้นซ้ำ · alert เด้งซ้ำ) และ 9101 ไม่ได้ publish จึงขึ้น DOWN ทั้งที่ consumer ปกติ
  #
  # รันแอปบน host แทน container (เช่น `npm run start:dev`): หยุด container ตัวนั้น แล้วเปลี่ยน
  # target ของ job นั้นเป็น host.docker.internal:<port> จากนั้น
  #   curl -X POST localhost:9090/-/reload

  # NestJS api-gateway
  - job_name: 'nestjs-api'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'

  # FastAPI detection service
  - job_name: 'fastapi-detect'
    static_configs:
      - targets: ['detection-api:8000']
    metrics_path: '/metrics'

  # Python Kafka consumer - prometheus_client start_http_server(9101)
  - job_name: 'detection-consumer'
    static_configs:
      - targets: ['detection-consumer:9101']
    metrics_path: '/metrics'

  # Kafka cluster metrics (ISR, replication lag, consumer offsets)
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']