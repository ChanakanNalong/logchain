name: Security Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── ช่องโหว่ของ dependency (blocking ที่ HIGH ขึ้นไป — PCI 6.3.3 ต้องแก้ critical/high) ──
      # 2026-09-24: ทั้งสองฝั่ง 0 ทุกระดับ จึงเปิด block ได้โดยไม่ค้าง · moderate ลงมายังไม่ block
      # (advisory ระดับกลางออกบ่อย ถ้า block จะแดงเพราะงานที่ไม่เกี่ยวกัน) — ดูใน log ของ step นี้
      - name: npm audit (backend)
        run: npm audit --audit-level=high

      - name: npm audit (dashboard)
        run: npm --prefix cylis-dashboard audit --audit-level=high

      # audit requirements.lock ไม่ใช่ image: ใน image torch ติดตั้งเป็น `2.13.0+cpu` ซึ่ง scanner
      # จับคู่กับ advisory ไม่ได้ (เคยหลุด CVE-2025-3000 ของ torch 2.12.0 มาแล้ว) · lock มีทุกแพ็กเกจใน image
      # รวม dependency ทางอ้อม (Dockerfile ลงด้วย -c lock และ build พังถ้าไม่ตรง) · --no-deps --disable-pip
      # = ตรวจตาม lock ตรง ๆ ไม่ติดตั้ง torch (~GB) · สร้าง lock ใหม่: ./scripts/detection-lock.sh
      # ubuntu-latest (24.04) ห้าม pip install ลง python ของระบบ (PEP 668) → ใช้ setup-python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (detection)
        run: |
          pip install --quiet pip-audit
          pip-audit -r detection/requirements.lock --no-deps --disable-pip --progress-spinner off

      # ── ด่านที่ทำให้ build แดงจริง ──
      # secret หลุดเข้า repo คือเคสที่เกิดมาแล้ว (.env backup ถูก commit ขึ้น public
      # repo อยู่ 10 วัน) ตอนนั้นสแกนตั้ง exit-code: 0 ไว้ CI เลยเขียวตลอดทั้งที่เจอ
      #
      # ทดสอบแล้วว่า Trivy secret scanner "ไม่จับ" ไฟล์ .env ที่เป็น key=value ธรรมดา
      # (ยิงกับไฟล์จริงที่หลุด — เงียบสนิท) จึงต้องมีสามด่านที่ทับช่องว่างกัน:
      #   1. เช็คตรง ๆ ว่ามีไฟล์ .env/key/cert ถูก track ไหม — ครอบเคสที่เคยเกิด 100%
      #   2. gitleaks — จับ key=value และ secret ที่ฝังในซอร์ส (ทดสอบแล้วจับได้ทั้งคู่)
      #   3. Trivy — จับ private key แบบ PEM/keystore ที่ gitleaks อาจข้าม
      - name: ไฟล์ความลับถูก track ไหม
        run: ./scripts/check-tracked-secrets.sh

      # สแกนเฉพาะไฟล์ใน tree ไม่ไล่ทั้ง history — คอมมิตแรกสุดมี README ของ NestJS
      # ที่ติด CI badge ซึ่งมีพารามิเตอร์หน้าตาเหมือน token ติดมาด้วย เป็น false
      # positive ที่ลบย้อนหลังไม่ได้ (จะสแกน history ต้องใส่ fingerprint ลง
      # .gitleaksignore ซึ่งเพี้ยนทุกครั้งที่ rewrite history — แลกไม่คุ้ม และไฟล์ที่
      # หลุดจริงยังไงก็ต้องโผล่อยู่ใน tree ตอน push อยู่แล้ว)
      #
      # หมายเหตุ: อย่าเขียนค่าตัวอย่างที่หน้าตาเหมือน secret ลงในคอมเมนต์ไฟล์นี้
      # gitleaks สแกนไฟล์ workflow ด้วย และเคยจับคอมเมนต์ของตัวเองจน CI แดงมาแล้ว
      - name: gitleaks (blocking)
        run: |
          docker run --rm -v "$PWD":/scan:ro zricethezav/gitleaks:latest \
            detect --source=/scan --no-git --redact -v

      - name: Trivy — secret scan (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1

      # block เฉพาะที่มีเวอร์ชันแก้แล้ว — ช่องโหว่ที่ยังไม่มี fix แก้ไม่ได้อยู่ดี ถ้า block จะแดงค้าง
      - name: Trivy — vulnerability scan (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
