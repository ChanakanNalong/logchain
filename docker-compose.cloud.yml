# override สำหรับ deploy บน server เพื่อน (NB-Lab · LXC CT141) — ขั้นตอนเต็ม: docs/runbooks/deploy-cloud.md
# เปิดใช้ด้วยบรรทัดใน .env ของเครื่องนั้น (ทุกคำสั่ง docker compose + scripts/ ใช้ตามอัตโนมัติ):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.cloud.yml
#
# เปลี่ยนแค่ https-proxy: http ล้วน (HTTPS จบที่ Cloudflare Tunnel ของเพื่อน) แยก 3 host → dashboard / backend / Keycloak
# bind เฉพาะ 172.17.0.1 (docker0) = ปลายทางที่ cloudflared ตั้งไว้ · เครื่องอื่นในวง 172.16.40.0/24 ยิงตรงไม่ได้
# service อื่นทั้งหมดยัง bind ${PUBLISH_ADDR:-127.0.0.1} — ห้ามตั้ง PUBLISH_ADDR บนเครื่องนี้
# (Prometheus / Alertmanager / Kafka EXTERNAL ไม่มี auth — ผล LAN pentest worklog 2026-09-29 หัวข้อ 7)
services:
  https-proxy:
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST}
      API_HOST: ${API_HOST}
      AUTH_HOST: ${AUTH_HOST}
    ports: !override
      - "172.17.0.1:80:8080"
    volumes: !override
      # ไม่มี cert ในเครื่อง — Cloudflare ถือ HTTPS
      - ./infra/caddy/Caddyfile.cloud:/etc/caddy/Caddyfile:ro
