# drop-in สำหรับ CT141: /etc/systemd/system/logchain-forwarder.service.d/ct141.conf
# access log ของ https-proxy อยู่ใต้ /home/logchain (750 — user forwarder เดินผ่านไม่ได้ และ unit ตั้ง ProtectHome=true)
# → bind เฉพาะ dir log แบบ read-only มาไว้ที่ /var/log/https-proxy ให้ service เห็น (ไม่ต้องเปิดสิทธิ์ home)
# dir ปลายทางเป็น nobody:adm 2750 · ไฟล์ 0640 → อ่านได้ผ่าน SupplementaryGroups=adm ของ unit
[Service]
BindReadOnlyPaths=/home/logchain/logchain/logs/https-proxy:/var/log/https-proxy
