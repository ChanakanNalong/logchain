name: logchain

# ─────────────────────────────────────────────────────────────────────────────
# `docker compose up -d` ยกทั้งระบบ: infra + backend + dashboard + detection
# ของที่ต้องเตรียมก่อน (.env, kafka certs, vault unseal) — ใช้ ./scripts/bootstrap.sh
#
# เรื่อง host ที่ต้องเข้าใจก่อนแก้ไฟล์นี้:
#   ค่าใน .env เขียนไว้สำหรับ "รันบน host" (localhost:5433, localhost:29092, ...)
#   พอรันใน compose network ต้องเป็นชื่อ service แทน — เลย override เฉพาะตัวที่
#   เกี่ยวกับ host ในบล็อก `environment:` ของแต่ละ service (ทับ env_file เสมอ)
#   ที่เหลือ (secret, feature flag) อ่านจาก .env ตรง ๆ ไม่ต้องเขียนซ้ำ
#
#   ยกเว้น 2 กลุ่มที่ห้ามเปลี่ยนเป็นชื่อ service:
#     - NEXT_PUBLIC_* ของ dashboard — รันบนเบราว์เซอร์ซึ่งอยู่นอก network
#     - KEYCLOAK_URL ของ backend — เป็น issuer ที่ต้องตรงกับ `iss` ในโทเคนที่
#       เบราว์เซอร์/สคริปต์ขอมาจาก localhost:8080 (ที่อยู่จริงที่ backend ยิงไป
#       แยกไปอยู่ KEYCLOAK_INTERNAL_URL)
# ─────────────────────────────────────────────────────────────────────────────

# port ทุกตัว publish ที่ ${PUBLISH_ADDR:-127.0.0.1} — เข้าได้จากเครื่องนี้เท่านั้น
# เดิม bind 0.0.0.0: Postgres / Kafka plaintext / Vault / Prometheus + Alertmanager (ไม่มี auth) เปิดให้ทั้ง LAN
# และ Docker publish ข้าม firewall ของเครื่อง (compliance review 2026-09-23 B15)
# ต้องให้เครื่องอื่นเข้าจริง (เช่น log source ข้ามเครื่องยิง :3000) → ตั้ง PUBLISH_ADDR ใน .env โดยตั้งใจ
services:
  postgres:
    image: postgres:16-alpine 
    container_name: logchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logchain
      # secrets come from .env (gitignored). DEV-ONLY values — never reuse in prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: logchain
      # consumed by infra/postgres/init/00-keycloak-db.sh to create the keycloak role
      KEYCLOAK_DB_PASSWORD: ${KC_DB_PASSWORD}
      # consumed by infra/postgres/init/01-replication-user.sh — pg_hba.conf อ้าง role นี้
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init scripts รันอัตโนมัติตอน container สร้างครั้งแรก
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logchain -d logchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Renders the realm template -> import volume, substituting ONLY the named
  # secret placeholders from .env. Keeps real secrets out of git (the committed
  # file is realm-logchain.json.template with ${...} placeholders).
  # Native `--import-realm` env substitution is unreliable (keycloak#12069/#20199),
  # so we render the file ourselves before Keycloak starts.
  keycloak-config:
    image: alpine:3.20
    container_name: logchain-keycloak-config
    command:
      - sh
      - -c
      - >
        apk add --no-cache gettext >/dev/null &&
        envsubst '$$LOGCHAIN_CLIENT_SECRET $$LOGCHAIN_INGESTOR_SECRET $$LOGCHAIN_ADMIN_CLIENT_SECRET $$KEYCLOAK_ADMIN_USER_PASSWORD'
        < /tmpl/realm-logchain.json.template
        > /import/realm-logchain.json &&
        echo "rendered realm-logchain.json"
    environment:
      # DEV-ONLY secrets from .env (gitignored)
      LOGCHAIN_CLIENT_SECRET: ${LOGCHAIN_CLIENT_SECRET}
      LOGCHAIN_INGESTOR_SECRET: ${LOGCHAIN_INGESTOR_SECRET}
      LOGCHAIN_ADMIN_CLIENT_SECRET: ${LOGCHAIN_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USER_PASSWORD: ${KEYCLOAK_ADMIN_USER_PASSWORD}
    volumes:
      - ./infra/keycloak:/tmpl:ro
      - keycloak_import:/import

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: logchain-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      # ใช้ postgres instance เดียวกับ app แต่คนละ database + role (สร้างใน 00-keycloak-db.sh)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      # secrets from .env (gitignored). DEV-ONLY values — never reuse in prod.
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # master-realm admin console login (secure this account's MFA at the master
      # realm — it is out of scope of the logchain realm import)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      # realm rendered by keycloak-config into this shared volume
      - keycloak_import:/opt/keycloak/data/import:ro
    ports:
      # default host port 8080 (container ยัง listen 8080 เหมือนเดิม). ถ้า 8080
      # บนเครื่อง dev ชนกับโปรเจกต์อื่น ตั้ง KEYCLOAK_HOST_PORT ใน .env เป็นค่าอื่น
      # แล้วอัปเดต KEYCLOAK_URL ของตัวเองให้ตรงกับพอร์ตที่เปลี่ยนด้วย
      -  "${PUBLISH_ADDR:-127.0.0.1}:${KEYCLOAK_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
        
  # Kafka broker (KRaft mode — ไม่ต้องใช้ Zookeeper)
  # hostname `kafka-1` ตรงกับ default KAFKA_BROKERS=kafka-1:9092 ในแอป
  # ── Kafka broker 1 (KRaft, controller + broker) ──
  kafka-1:
    image: bitnamilegacy/kafka:3.7.1
    container_name: logchain-kafka-1
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      # ต้องเป็นค่าเดียวกันทั้ง 3 broker ไม่งั้น bitnami สุ่มให้ทีละ container
      # แล้ว Raft จะ vote กันไม่ได้ (INCONSISTENT_CLUSTER_ID)
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_KRAFT_CLUSTER_ID:-fa18wiRZTcaEzLyvh5qO7A}"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      # 9092 = internal (container-to-container), 29092 = external (host, PLAINTEXT)
      # 9094 DOCKER_SSL = mTLS ใน docker network (advertise kafka-N:9094) — backend / detection ใช้ตัวนี้
      #   SSL (39092) advertise localhost ใช้ได้จาก host เท่านั้น: container ต่อแล้ว metadata ชี้กลับ localhost ของตัวเอง
      #   ssl.* + client auth (KAFKA_TLS_CLIENT_AUTH) เป็นค่า global ครอบทุก listener ที่ map เป็น SSL
      #   PLAINTEXT 9092 ยังเหลือไว้ให้ inter-broker / kafka-init / kafka-exporter (ไม่ publish ออก host)
      # 39092 = external mTLS — ชื่อ listener ต้องโผล่ใน PROTOCOL_MAP เป็น SSL:SSL
      # ไม่งั้น kafka_has_ssl_listener() ใน libkafka.sh return false แล้ว
      # kafka_configure_ssl() จะไม่ถูกเรียก -> ไม่มี ssl.keystore.*/ssl.truststore.* ใน server.properties
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092,SSL://:39092,DOCKER_SSL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:29092,SSL://localhost:39092,DOCKER_SSL://kafka-1:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SSL:SSL,DOCKER_SSL:SSL"
      # ---- mTLS (PEM) ----
      # ชื่อไฟล์ถูก hardcode ใน libkafka.sh: kafka.keystore.pem / kafka.keystore.key /
      # kafka.truststore.pem ใน $KAFKA_CERTS_DIR = /opt/bitnami/kafka/config/certs
      # ห้ามตั้ง KAFKA_CFG_SSL_KEYSTORE_* เอง — สคริปต์ inline เนื้อ PEM ลง
      # ssl.keystore.key / ssl.keystore.certificate.chain / ssl.truststore.certificates ให้
      # ไม่ต้องมี KAFKA_CERTIFICATE_PASSWORD เพราะ private key เป็น PKCS8 แบบไม่เข้ารหัส
      # (ถ้าตั้ง จะกลายเป็น ssl.key.password แล้วโหลด key ไม่ผ่าน)
      KAFKA_TLS_TYPE: "PEM"
      KAFKA_TLS_CLIENT_AUTH: "required"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # cluster-wide defaults ตาม scope (3 broker + ISR)
      # NUM_PARTITIONS ต้องตรงกับ create-topics.sh: client ที่ต่อมาก่อน kafka-init
      # (เช่น NestJS consumer ที่รันบน host อยู่แล้ว) auto-create topic ทัน แล้ว
      # --if-not-exists ของ kafka-init จะไม่แก้ partition count ให้ทีหลัง
      # default ของ Kafka คือ 1 ซึ่งทำให้ topic ที่แพ้ race มี partition เดียวถาวร
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:29092:29092"
      - "${PUBLISH_ADDR:-127.0.0.1}:39092:39092"
    volumes:
      - kafka_1_data:/bitnami/kafka
      - ./infra/kafka/certs/kafka-1:/opt/bitnami/kafka/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      # JVM startup ของ kafka-topics.sh กินเวลาเกิน 10s ได้ตอนเครื่องโหลดหนัก
      timeout: 25s
      retries: 5
      start_period: 45s

  # ── Kafka broker 2 ──
  kafka-2:
    image: bitnamilegacy/kafka:3.7.1
    container_name: logchain-kafka-2
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_KRAFT_CLUSTER_ID:-fa18wiRZTcaEzLyvh5qO7A}"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29093,SSL://:39093,DOCKER_SSL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29093,SSL://localhost:39093,DOCKER_SSL://kafka-2:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SSL:SSL,DOCKER_SSL:SSL"
      # ---- mTLS (PEM) ----
      # ชื่อไฟล์ถูก hardcode ใน libkafka.sh: kafka.keystore.pem / kafka.keystore.key /
      # kafka.truststore.pem ใน $KAFKA_CERTS_DIR = /opt/bitnami/kafka/config/certs
      # ห้ามตั้ง KAFKA_CFG_SSL_KEYSTORE_* เอง — สคริปต์ inline เนื้อ PEM ลง
      # ssl.keystore.key / ssl.keystore.certificate.chain / ssl.truststore.certificates ให้
      # ไม่ต้องมี KAFKA_CERTIFICATE_PASSWORD เพราะ private key เป็น PKCS8 แบบไม่เข้ารหัส
      # (ถ้าตั้ง จะกลายเป็น ssl.key.password แล้วโหลด key ไม่ผ่าน)
      KAFKA_TLS_TYPE: "PEM"
      KAFKA_TLS_CLIENT_AUTH: "required"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # cluster-wide defaults ตาม scope (3 broker + ISR)
      # NUM_PARTITIONS ต้องตรงกับ create-topics.sh: client ที่ต่อมาก่อน kafka-init
      # (เช่น NestJS consumer ที่รันบน host อยู่แล้ว) auto-create topic ทัน แล้ว
      # --if-not-exists ของ kafka-init จะไม่แก้ partition count ให้ทีหลัง
      # default ของ Kafka คือ 1 ซึ่งทำให้ topic ที่แพ้ race มี partition เดียวถาวร
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      # ฝั่ง container ต้องเป็นพอร์ตของ EXTERNAL listener (29093) ไม่ใช่ 29092
      # ซึ่งไม่มีอะไร listen อยู่เลย (PLAINTEXT อยู่ที่ 9092)
      - "${PUBLISH_ADDR:-127.0.0.1}:29093:29093"
      - "${PUBLISH_ADDR:-127.0.0.1}:39093:39093"
    volumes:
      - kafka_2_data:/bitnami/kafka
      - ./infra/kafka/certs/kafka-2:/opt/bitnami/kafka/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      # JVM startup ของ kafka-topics.sh กินเวลาเกิน 10s ได้ตอนเครื่องโหลดหนัก
      timeout: 25s
      retries: 5
      start_period: 45s

  # ── Kafka broker 3 ──
  kafka-3:
    image: bitnamilegacy/kafka:3.7.1
    container_name: logchain-kafka-3
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_KRAFT_CLUSTER_ID: "${KAFKA_KRAFT_CLUSTER_ID:-fa18wiRZTcaEzLyvh5qO7A}"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29094,SSL://:39094,DOCKER_SSL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:29094,SSL://localhost:39094,DOCKER_SSL://kafka-3:9094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SSL:SSL,DOCKER_SSL:SSL"
      # ---- mTLS (PEM) ----
      # ชื่อไฟล์ถูก hardcode ใน libkafka.sh: kafka.keystore.pem / kafka.keystore.key /
      # kafka.truststore.pem ใน $KAFKA_CERTS_DIR = /opt/bitnami/kafka/config/certs
      # ห้ามตั้ง KAFKA_CFG_SSL_KEYSTORE_* เอง — สคริปต์ inline เนื้อ PEM ลง
      # ssl.keystore.key / ssl.keystore.certificate.chain / ssl.truststore.certificates ให้
      # ไม่ต้องมี KAFKA_CERTIFICATE_PASSWORD เพราะ private key เป็น PKCS8 แบบไม่เข้ารหัส
      # (ถ้าตั้ง จะกลายเป็น ssl.key.password แล้วโหลด key ไม่ผ่าน)
      KAFKA_TLS_TYPE: "PEM"
      KAFKA_TLS_CLIENT_AUTH: "required"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      # cluster-wide defaults ตาม scope (3 broker + ISR)
      # NUM_PARTITIONS ต้องตรงกับ create-topics.sh: client ที่ต่อมาก่อน kafka-init
      # (เช่น NestJS consumer ที่รันบน host อยู่แล้ว) auto-create topic ทัน แล้ว
      # --if-not-exists ของ kafka-init จะไม่แก้ partition count ให้ทีหลัง
      # default ของ Kafka คือ 1 ซึ่งทำให้ topic ที่แพ้ race มี partition เดียวถาวร
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:29094:29094"
      - "${PUBLISH_ADDR:-127.0.0.1}:39094:39094"
    volumes:
      - kafka_3_data:/bitnami/kafka
      - ./infra/kafka/certs/kafka-3:/opt/bitnami/kafka/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      # JVM startup ของ kafka-topics.sh กินเวลาเกิน 10s ได้ตอนเครื่องโหลดหนัก
      timeout: 25s
      retries: 5
      start_period: 45s

  # ---- Topic provisioning (one-shot) ----
  # ต้องสร้าง topic ล่วงหน้า ไม่ปล่อยให้ auto-create — auto-create เกิดต่อเมื่อมี client
  # ต่อติดจริง แต่ consumer ฝั่ง NestJS ยอมแพ้ถาวรหลัง retry 5 ครั้งถ้า broker ยังไม่ขึ้น
  # ผลคือ alerts.raw/alerts.cde ไม่เกิด และ alert หายเงียบ ๆ ทั้งสองฝั่ง
  # เหตุผลเต็มอยู่ในหัวไฟล์ create-topics.sh + docs/runbooks/kafka-topics.md
  kafka-init:
    image: bitnamilegacy/kafka:3.7.1
    container_name: logchain-kafka-init
    # ยิงผ่าน internal listener PLAINTEXT :9092 จากในเน็ตเวิร์ก compose
    # จะได้ไม่ต้อง mount cert + ตั้ง ssl config ให้ kafka-topics.sh เหมือน external :39092
    environment:
      KAFKA_BOOTSTRAP: "kafka-1:9092"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    volumes:
      - ./infra/kafka/create-topics.sh:/kafka/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/kafka/create-topics.sh"]
    restart: "no"
    networks:
      - default

  # ---- Kafka exporter (metrics for Prometheus) ----
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: logchain-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka-1:9092"
      - "--kafka.server=kafka-2:9092"
      - "--kafka.server=kafka-3:9092"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:9308:9308"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    networks:
      - default

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: logchain-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'  # dev: เก็บ 7 วันพอ
      - '--web.enable-lifecycle'            # ให้ reload config ผ่าน API ได้
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:9090:9090"
    networks:
      - default
    # ให้ Prometheus เห็น service บน host — ใช้เฉพาะตอนรันแอปบน host แทน container
    # (ดูคอมเมนต์ใน infra/prometheus/prometheus.yml)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---- Postgres backup อัตโนมัติ (logical dump วันละครั้ง) ----
  # standby กันเครื่องพังได้ แต่ลบ/ข้อมูลเสีย replicate ตามไปด้วย — ต้องมี dump แยก
  # ไฟล์: ./backups/postgres/<UTC>/ (0600 · gitignored) · กู้คืน: docs/RTO-RPO-Compliance-Signoff.md
  postgres-backup:
    image: postgres:16-alpine          # ตัวเดียวกับ DB → pg_dump เวอร์ชันตรงกัน
    container_name: logchain-postgres-backup
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # ไฟล์ backup เป็นของเรา ไม่ใช่ root
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: logchain
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./infra/postgres-backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # ---- สำเนา backup นอกเครื่อง (rclone crypt → cloud) ----
  # ยังไม่ตั้ง remote = รอเฉย ๆ · วิธีตั้ง: README หัวข้อ Backup ฐานข้อมูล · config + token อยู่ใน
  # infra/rclone/.secrets/rclone.conf (gitignored · rw เพราะ rclone refresh token แล้วเขียนกลับ)
  backup-offsite:
    image: rclone/rclone:1.68
    container_name: logchain-backup-offsite
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "/offsite.sh"]
    environment:
      RCLONE_CACHE_DIR: /tmp
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-logchain-backup:}
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-3600}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    volumes:
      - ./infra/backup-offsite/offsite.sh:/offsite.sh:ro
      - ./infra/rclone/.secrets:/config/rclone
      - ./backups:/backups
    networks:
      - default

  # ---- Alertmanager (ส่ง alert ของ Prometheus ออกทาง email) ----
  # ยังไม่ตั้งอีเมล = รับ alert ไว้เฉย ๆ (ดูที่ :9093) · วิธีตั้ง: README หัวข้อ Alert แจ้งทาง email
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: logchain-alertmanager
    restart: unless-stopped
    # uid ของเรา — ไฟล์รหัสเป็น 0600 ของเราได้ ไม่ต้องเปิดให้ทุกคนอ่าน
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "/etc/alertmanager/render.sh"]
    command:
      - /bin/alertmanager
      - --config.file=/tmp/alertmanager.yml
      # silence หายเมื่อ restart (dev) — volume ของ image เป็นของ nobody เขียนด้วย uid เราไม่ได้
      - --storage.path=/tmp/alertmanager-data
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-smtp.gmail.com:587}
    volumes:
      - ./infra/alertmanager/render.sh:/etc/alertmanager/render.sh:ro
      - ./infra/alertmanager/.secrets:/etc/alertmanager/secrets:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:9093:9093"
    networks:
      - default

  # ---- Grafana (visualization) ----
  grafana:
    image: grafana/grafana:11.3.0
    container_name: logchain-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:3002:3000"
    depends_on:
      - prometheus
    networks:
      - default

  # ---- node-exporter (host metrics: CPU/RAM/disk) ----
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: logchain-node-exporter
    restart: unless-stopped
    command: 
      - '--path.rootfs=/host'
      # สถานะ backup ที่ postgres-backup เขียนไว้ → metric logchain_backup_*
      - '--collector.textfile.directory=/textfile'
    volumes:
      - ./backups/metrics:/textfile:ro
      # rslave ตัดออก — Docker Desktop (Windows/Mac) VM root ไม่รองรับ shared/slave
      # mount propagation ("path / is mounted on / but it is not a shared or slave mount")
      - /:/host:ro
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:9100:9100"
    networks:
      - default

  # standby: data dir มาจาก pg_basebackup -R (สร้าง standby.signal + primary_conninfo)
  # ไม่ใช้ POSTGRES_* env เพราะ data dir ถูก seed มาแล้ว entrypoint จะข้าม initdb
  # hot standby - clone จาก primary ด้วย pg_basebackup ตอนสตาร์ทครั้งแรก
  # ไม่มี POSTGRES_PASSWORD เพราะไม่ได้ initdb เอง (ข้อมูลมาจาก primary ทั้งก้อน)
  postgres-standby:
    image: postgres:16-alpine
    container_name: logchain-postgres-standby
    restart: unless-stopped
    environment:
      PGUSER: logchain
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:5434:5432"
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/standby-entrypoint.sh:/usr/local/bin/standby-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/standby-entrypoint.sh"]
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logchain -d logchain"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: logchain-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://logchain:${POSTGRES_PASSWORD}@postgres:5432/logchain?sslmode=disable"
      PG_EXPORTER_INCLUDE_DATABASES: "logchain,keycloak"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  # ── HashiCorp Vault (secret management, KV-v2 + AppRole) ──
  # server mode + file storage: data อยู่บน volume ไม่หายตอน restart
  # แลกมาด้วยการที่มันตื่นมา sealed เสมอ -> vault-unseal เป็นคนปลดล็อกให้
  vault:
    image: hashicorp/vault:1.18
    container_name: logchain-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK  # ให้ mlock ทำงาน (Vault ป้องกัน swap memory ที่มี secret)
    # อย่าใส่ -config เอง! entrypoint ของ image เติม -config=/vault/config ให้อยู่แล้ว
    # ถ้าใส่ซ้ำ vault จะโหลด vault.hcl สองรอบ ได้ listener ซ้อนกัน -> bind: address already in use
    command: server
    environment:
      # vault CLI (ที่ healthcheck เรียก) default ยิง https:// ถ้าไม่ตั้งจะ TLS error
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./infra/vault/config:/vault/config:ro
    healthcheck:
      # exit 0 = unsealed เท่านั้น (sealed = 2) -> service_healthy แปลว่าใช้งานได้จริง
      # ไม่ใช่แค่ process ขึ้น ซึ่งเป็นเงื่อนไขที่ vault-init รออยู่
      test: ["CMD-SHELL", "vault status > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # init Vault ครั้งแรก + คอย unseal ให้ทุกครั้งที่ vault ถูก restart
  # ต้องเป็น sidecar ที่รันค้าง ไม่ใช่ one-shot เพราะ vault มี restart: unless-stopped
  # พอเครื่อง reboot vault จะฟื้นมาแบบ sealed เองโดยไม่มีใครปลดให้
  vault-unseal:
    image: hashicorp/vault:1.18
    container_name: logchain-vault-unseal
    restart: unless-stopped
    depends_on:
      - vault
    environment:
      VAULT_ADDR: "http://vault:8200"
      # chown ของใน .secrets กลับให้เจ้าของเครื่อง — ไม่งั้นอ่าน init.env เองไม่ได้
      # และลบโฟลเดอร์ตอน reset ไม่ได้ (ดูคอมเมนต์ใน unseal.sh)
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
    volumes:
      - ./infra/vault/unseal.sh:/vault/unseal.sh:ro
      - ./infra/vault/.secrets:/vault/secrets  # gitignored — unseal keys + root token
    entrypoint: ["/bin/sh", "/vault/unseal.sh"]

  vault-init:
    image: hashicorp/vault:1.18
    container_name: logchain-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      # init.sh เขียน approle.env ลง bind mount ในฐานะ root — ส่ง uid/gid ของคนที่
      # รัน compose มาให้ chown กลับ ไม่งั้น scripts/bootstrap.sh อ่านไฟล์ตัวเองไม่ได้
      # (bootstrap.sh export ให้อัตโนมัติ; สั่ง compose เองก็ใช้ `HOST_UID=$(id -u)
      #  HOST_GID=$(id -g) docker compose up -d` หรือใส่ 2 ตัวนี้ไว้ใน .env)
      HOST_UID: ${HOST_UID:-0}
      HOST_GID: ${HOST_GID:-0}
      # ไม่มี VAULT_TOKEN แล้ว — init.sh อ่าน root token จาก .secrets/init.env
      # ที่ vault-unseal สร้างไว้ตอน operator init
      #
      # secrets ที่จะ seed เข้า Vault (มาจาก .env ปัจจุบัน)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      LOGCHAIN_CLIENT_SECRET: ${LOGCHAIN_CLIENT_SECRET}
      LOGCHAIN_INGESTOR_SECRET: ${LOGCHAIN_INGESTOR_SECRET}
      LOGCHAIN_ADMIN_CLIENT_SECRET: ${LOGCHAIN_ADMIN_CLIENT_SECRET}
      BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_TO: ${MAIL_TO:-}
    volumes:
      - ./infra/vault/init.sh:/vault/init.sh:ro
      - ./infra/vault/policies:/vault/policies:ro
      # rw (เดิมเป็น ro) — init.sh เขียน approle.env กลับมาให้ bootstrap.sh ใช้
      - ./infra/vault/.secrets:/vault/secrets
    entrypoint: ["/bin/sh", "vault/init.sh"]
    restart: "no"

  # ═══════════════════════ application services ═══════════════════════

  # ── NestJS API gateway ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: logchain-backend:dev
    container_name: logchain-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # override เฉพาะค่าที่ผูกกับ host — ที่เหลือมาจาก .env ตาม env_file ข้างบน
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      # mTLS ผ่าน DOCKER_SSL (compliance review B3) · path ใน container — .env ของเครื่อง dev เป็น path บน host
      KAFKA_BROKERS: "kafka-1:9094,kafka-2:9094,kafka-3:9094"
      # internal listener เป็น PLAINTEXT — mTLS มีเฉพาะ EXTERNAL (39092-39094)
      # ที่ไว้ demo การต่อจาก host ดู scripts/demo-mtls.sh
      KAFKA_SSL_ENABLED: "true"
      KAFKA_SSL_CA: /app/infra/kafka/certs/ca.crt
      KAFKA_SSL_CERT: /app/infra/kafka/certs/clients/nestjs.crt
      KAFKA_SSL_KEY: /app/infra/kafka/certs/clients/nestjs.key
      VAULT_ADDR: "http://vault:8200"
      # KEYCLOAK_URL (issuer) ห้าม override — ต้องเป็น localhost:8080 ตาม .env
      # ตัวที่ backend ใช้ยิงจริงคือตัวนี้
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      # ให้สลับ KAFKA_SSL_ENABLED=true ได้โดยไม่ต้อง rebuild image
      # path ใน .env เป็น ./infra/kafka/certs/... ซึ่ง resolve จาก WORKDIR /app พอดี
      - ./infra/kafka/certs:/app/infra/kafka/certs:ro
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      vault: {condition: service_healthy}
      # topic ต้องมีก่อน ไม่งั้น consumer ยอมแพ้ถาวรหลัง retry 5 ครั้ง
      kafka-init: {condition: service_completed_successfully}
      # AppRole ต้องถูกสร้างก่อน ไม่งั้น vault login 403
      vault-init: {condition: service_completed_successfully}
    healthcheck:
      # /health และ /metrics อยู่นอก global prefix api/v1 (ดู src/main.ts)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Next.js dashboard ──
  # NEXT_PUBLIC_* ถูก inline ตอน build และรันบนเบราว์เซอร์ที่อยู่ "นอก" docker
  # network — ต้องเป็น localhost เสมอ เปลี่ยนเป็น backend:3000 เมื่อไหร่หน้าเว็บพังทันที
  cylis-dashboard:
    build:
      context: ./cylis-dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-logchain}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-logchain-frontend}
    image: cylis-dashboard:dev
    container_name: cylis-dashboard-app
    restart: unless-stopped
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:3003:3000"
    depends_on:
      backend: {condition: service_started}
    healthcheck:
      # node:alpine ไม่มี wget/curl แบบ full — ใช้ node ยิงเอง
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Detection: FastAPI (Deeplog inference) ──
  # แยกเป็น 2 service จาก image เดียวกัน คนละ command — restart/debug แยกกันได้
  detection-api:
    build:
      context: ./detection
    image: logchain-detection:dev
    container_name: logchain-detection-api
    restart: unless-stopped
    environment:
      # api ไม่ต้องใช้ Vault/Kafka — แค่โหลดโมเดลแล้วตอบ /api/v1/detect
      PYTHONUNBUFFERED: "1"
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      # โหลด torch + state_dict ตอน startup กินเวลาหลายสิบวินาทีบนเครื่องช้า
      retries: 5
      start_period: 60s

  # ── Detection: Kafka consumer (logs.raw -> alerts.raw/alerts.cde) ──
  detection-consumer:
    image: logchain-detection:dev
    container_name: logchain-detection-consumer
    restart: unless-stopped
    command: ["python", "-m", "app.consumer"]
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BROKERS: "kafka-1:9094,kafka-2:9094,kafka-3:9094"
      KAFKA_SSL_ENABLED: "true"
      KAFKA_SSL_CA: /certs/ca.crt
      KAFKA_SSL_CERT: /certs/detection.crt
      KAFKA_SSL_KEY: /certs/detection.key
      DETECT_URL: "http://detection-api:8000/api/v1/detect"
      VAULT_ADDR: "http://vault:8200"
      # app/vault.py refuse-to-start ถ้า 2 ตัวนี้ไม่มี (ตั้งใจ — fail ดังกว่า
      # เงียบ ๆ แล้วไม่มี alert ออก) scripts/bootstrap.sh เติมให้ใน .env
      # ยังไม่ได้เติม = container วน restart พร้อม log
      # "Vault config missing - required: VAULT_ADDR, VAULT_DETECTION_ROLE_ID, ..."
      # ห้ามใช้ ${VAR:?...} ตรงนี้ — compose จะ error ทั้งไฟล์ ทำให้ `up -d` ของ
      # service อื่นพังตามไปด้วย ซึ่งคือ phase แรกที่ bootstrap.sh ต้องใช้
      VAULT_DETECTION_ROLE_ID: ${VAULT_DETECTION_ROLE_ID:-}
      VAULT_DETECTION_SECRET_ID: ${VAULT_DETECTION_SECRET_ID:-}
    depends_on:
      detection-api: {condition: service_healthy}
      vault: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      vault-init: {condition: service_completed_successfully}
    volumes:
      # client cert สำหรับ mTLS ของ Kafka (DOCKER_SSL :9094)
      - ./infra/kafka/certs/clients:/certs:ro

volumes:
  postgres_data:
  postgres_standby_data:
  keycloak_import:
  prometheus_data:
  grafana_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  vault_data: