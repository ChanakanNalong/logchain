# ⚠️ ไฟล์นี้ไว้รัน dashboard เดี่ยว ๆ ตอน dev เท่านั้น (เช่น อยากแก้ UI โดยไม่ยกทั้ง stack)
# ของจริงที่ใช้รันทั้งระบบคือ service `cylis-dashboard` ใน ../docker-compose.yml
#   รันทั้งระบบ:  cd .. && docker compose up -d
#   รันเดี่ยว:     docker compose -f docker-compose.yml up -d --build
# แก้ build args ที่นี่แล้วอย่าลืมแก้ที่ ../docker-compose.yml ด้วย — สองไฟล์นี้ไม่ได้ผูกกัน

services:
  cylis-dashboard:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-logchain}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-logchain-frontend}
    container_name: cylis-dashboard-app
    ports:
      - "3003:3000"
    restart: unless-stopped
