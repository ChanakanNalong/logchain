# Wazuh-style security rules for LogChain
# format: ตามแนวคิด Wazuh rules แต่ปรับให้ใช้ได้ใน Python consumer
#
# fields:
#   id: rule ID (เลข 5 หลัก ตาม Wazuh convention)
#   description: คำอธิบาย (โผล่ใน alert title)
#   severity: WARNING / CRITICAL
#   match_patterns: list ของ regex/keyword ที่ match กับ message
#   event_types: ถ้ามี - จำกัด rule นี้ให้ match แค่ event_type ที่ ระบุ
#   threshold: optional - match X ครั้งใน Y วินาที (frequency rule)
#     distinct_by: optional regex (1 group) - นับ 1 ครั้งต่อค่าที่ไม่ซ้ำในหน้าต่าง (ไม่เจอ = นับทุกบรรทัด)
#   cde_scope_only: ถ้า true -> match เฉพาะ log ที่อยู่ใน CDE (cdeScope=true)
#   url_decode: ถ้า true -> ลอง match กับสำเนาที่ URL-decode แล้วด้วย (message ที่เก็บไม่เปลี่ยน)
#
# threshold / requires_prior_rule นับแยกตาม sourceIp (ไม่มี sourceIp = นับตาม source)
# — forwarder ตัวเดียวส่งทุก log เป็น source เดียว ถ้านับตาม source ผู้โจมตีทุก IP จะถูกรวมเป็นก้อนเดียว

rules:
  # ---- Authentication attacks ----
  - id: 5710
    description: "Multiple authentication failures (brute force)"
    severity: CRITICAL
    match_patterns:
      - "(?i)authentication.{0,20}fail"
      - "(?i)login.{0,20}(fail|denied|invalid)"
      - "(?i)wrong password"
      # sshd: "Failed password for root from …" / "Failed password for invalid user admin from …"
      - "(?i)failed password for "
      # sshd: "Invalid user admin from …" — ตัวพิมพ์ใหญ่ตรงตัว ไม่ให้นับ "… for invalid user …" ซ้ำ
      # หรือ "Connection closed by invalid user …" (บรรทัดปิด connection ไม่ใช่การเดารหัส)
      - "\\bInvalid user \\S+ from\\b"
    threshold:
      count: 5
      window_seconds: 60
      # sshd เขียน "Invalid user X from IP port P" + "Failed password for invalid user X from IP port P"
      # ต่อการเดา 1 ครั้ง — นับ 1 ครั้งต่อ (sourceIp, port) ไม่ให้กลายเป็น 2
      # ข้อแลก: เดาหลายรหัสใน connection เดียว (MaxAuthTries) ก็นับเป็น 1
      distinct_by: "\\bport (\\d+)\\b"

  - id: 5715
    description: "Successful login after multiple failures"
    severity: WARNING
    match_patterns:
      - "(?i)login.{0,20}success"
      # sshd: "Accepted publickey for kan from …" / "Accepted keyboard-interactive/pam for …"
      - "(?i)\\baccepted (password|publickey|keyboard-interactive(/\\S+)?) for\\b"
    requires_prior_rule: 5710   # ต้องเป็น 5710 ของ IP เดียวกัน
    window_seconds: 300

  # ---- Privilege escalation ----
  - id: 5820
    description: "Privilege escalation attempt"
    severity: CRITICAL
    match_patterns:
      - "(?i)sudo.{0,30}(root|admin)"
      - "(?i)privilege.{0,20}(escalat|elevat)"
      - "(?i)unauthorized.{0,20}(escalat|access)"
      - "(?i)setuid.{0,10}0"

  # ---- Injection attacks ----
  - id: 31100
    description: "SQL injection pattern detected"
    severity: CRITICAL
    match_patterns:
      - "(?i)(union\\s+select|or\\s+1\\s*=\\s*1|';\\s*drop\\s+table)"
      - "(?i)(--\\s*$|/\\*.*\\*/)"
      - "(?i)0x[0-9a-f]{8,}"
    # web log ส่ง query string แบบ encode มา (id=1%20UNION%20SELECT / 1+UNION+SELECT)
    url_decode: true

  - id: 31151
    description: "Command injection attempt"
    severity: CRITICAL
    match_patterns:
      - "(?i)(;\\s*(rm|cat|wget|curl|nc)\\s)"
      - "(?i)(\\$\\(.*\\)|`.*`)"
      # "../../" ย้ายไปเป็นของ 60002 (path traversal) — เดิมอยู่ที่นี่และ 31151 มาก่อนในไฟล์
      # /../../etc/passwd จึงถูกรายงานเป็น command injection

  # --- PCI / CDE-specific (highest priorty) ----
  - id: 90001
    description: "Card data access from non-CDE context"
    severity: CRITICAL
    match_patterns: 
    # ต้องเป็นคำ — เดิมไม่มี \b: "company", "panel", "expand", "Japan" โดนหมด
    # "[PAN]" (เลขบัตรที่ masking แทนไว้) ยังโดนเพราะ [ ] ไม่ใช่ตัวอักษร
    - "(?i)\\b(cards?|pans?|cvv|cardholders?)\\b"
    cde_scope_only: false # match เฉพาะ log ที่ cde_scope=false
                          # แต่ message พูดถึง card -> ผิดปกติ
    cde_alert: true       # -> ส่ง alert ไป channel CDE

  - id: 90002
    description: "Cardholder data access logged"
    severity: WARNING
    event_types: ["PAYMENT", "CARD_ACCESS"]
    cde_scope_only: true  # match เฉพาะ CDE log
    cde_alert: true

  # ---- Anomaly indeicators ----
  - id: 60001
    description: "Suspicious user agent or scanner"
    severity: WARNING
    match_patterns:
      - "(?i)(sqlmap|nikto|nmap|burp|metasploit|hydra)"
      - "(?i)(bot|crawler|spider).{0,20}admin"
      # scanner ที่เจอจริงบน VPS
      - "(?i)\\b(zgrab|masscan|zmap|nuclei|gobuster|dirbuster|feroxbuster|ffuf|wpscan|acunetix|netsparker|openvas)\\b"
      # path ที่ scanner ไล่หา (ไฟล์ความลับ / repo / WordPress)
      - "(?i)(/\\.env\\b|/\\.git/|/wp-admin\\b|/wp-login\\.php)"

  - id: 60002
    description: "Path traversal attempt"
    severity: CRITICAL
    match_patterns:
      - "(\\.\\./|\\.\\.\\\\)"
      - "(?i)(/etc/passwd|/etc/shadow|c:\\\\windows)"